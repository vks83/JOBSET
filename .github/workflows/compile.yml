<Project Sdk="Microsoft.NET.Sdk">

  <PropertyGroup>
    <TargetFramework>net6.0</TargetFramework>
    <ImplicitUsings>enable</ImplicitUsings>
    <Nullable>enable</Nullable>
    <AppendTargetFrameworkToOutputPath>false</AppendTargetFrameworkToOutputPath>
  </PropertyGroup>

  <ItemGroup>
    <Reference Include="MelonLoader">
      <HintPath>$(ProjectDir)MelonLoader.dll</HintPath>
    </Reference>
    <Reference Include="BoneLib">
      <HintPath>$(ProjectDir)BoneLib.dll</HintPath>
    </Reference>
    <Reference Include="LabFusion">
      <HintPath>$(ProjectDir)LabFusion.dll</HintPath>
    </Reference>
    <Reference Include="UnityEngine.CoreModule">
      <HintPath>$(ProjectDir)UnityEngine.CoreModule.dll</HintPath>
    </Reference>
  </ItemGroup>

</Project>
